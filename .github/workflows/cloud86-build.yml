
name: Build SocialBoost Leonida Atlas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v0.8.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build for SocialBoost /map/
        run: pnpm build
        env:
          ATLAS_BASE_PATH: /map/

      - name: Upload production files
        uses: actions/upload-artifact@v4
        with:
          name: socialboost-map-dist
          path: dist/
          if-no-files-found: error
